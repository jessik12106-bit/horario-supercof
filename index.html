<!DOCTYPE html>
<html>
<head>
  <title>Gestión de Horarios</title>

  <style>
    body {
      font-family: Arial;
      background: #eef2f7;
      margin: 0;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 8px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #2563eb;
      color: white;
    }

    .resaltado {
      font-weight: bold;
      border: 2px solid orange;
    }
  </style>
</head>

<body>

<header>📅 Sistema de Horarios</header>

<div class="container">

  <div class="card" id="login">
    <input type="text" id="usuario" placeholder="Usuario"><br><br>
    <input type="password" id="password" placeholder="Contraseña"><br><br>
    <button onclick="login()">Ingresar</button>
  </div>

  <div id="app" style="display:none;">

    <button onclick="cerrarSesion()">Cerrar sesión</button>

    <br><br>

    🔎 Buscar:
    <input type="text" id="filtroNombre" onkeyup="filtrar()">

    👥 Grupo:
    <select id="filtroGrupo" onchange="filtrar()">
      <option value="">Todos</option>
    </select>

    <table id="tabla"></table>

  </div>

</div>

<script>

const url = "TU_URL_AQUI";

let datosGlobal = [];

const nombresResaltados = [
  "Cristhian Perez","Patricia Marin","Liliana Prieto",
  "Santiago Fajardo","Gustavo Morales","Fabian Valero",
  "Wilmar Chavez","Sneider Rios"
];

// LOGIN
function login() {
  fetch(url, {
    method: "POST",
    body: JSON.stringify({
      action: "login",
      usuario: usuario.value,
      password: password.value
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      localStorage.setItem("usuario", usuario.value);
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      cargarDatos();
    } else {
      alert("Error");
    }
  });
}

// CARGAR
function cargarDatos() {
  fetch(url)
    .then(res => res.json())
    .then(data => {
      datosGlobal = data;
      llenarFiltroGrupo(data);
      pintarTabla(data);
    });
}

// GRUPOS
function llenarFiltroGrupo(data) {
  let grupos = new Set();

  data.slice(2).forEach(fila => {
    grupos.add(fila[0].valor);
  });

  let select = document.getElementById("filtroGrupo");
  select.innerHTML = '<option value="">Todos</option>';

  grupos.forEach(g => {
    let option = document.createElement("option");
    option.value = g;
    option.text = g;
    select.appendChild(option);
  });
}

// TABLA
function pintarTabla(data) {
  let tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  data.forEach((fila, i) => {
    let tr = document.createElement("tr");

    fila.forEach((col, j) => {
      let celda = document.createElement(i < 2 ? "th" : "td");

      let valor = col.valor;
      let color = col.color;

      celda.innerText = valor;

      if (color && color !== "#ffffff") {
        celda.style.background = color;
      }

      if (i > 1 && j === 1 && nombresResaltados.includes(valor)) {
        celda.classList.add("resaltado");
      }

      tr.appendChild(celda);
    });

    tabla.appendChild(tr);
  });
}

// FILTRO
function filtrar() {
  let nombre = filtroNombre.value.toLowerCase();
  let grupo = filtroGrupo.value;

  let encabezado1 = datosGlobal[0];
  let encabezado2 = datosGlobal[1];

  let filtrados = datosGlobal.slice(2).filter(fila => {
    let n = fila[1].valor.toLowerCase();
    let g = fila[0].valor;

    return n.includes(nombre) && (grupo === "" || g === grupo);
  });

  pintarTabla([encabezado1, encabezado2, ...filtrados]);
}

// LOGOUT
function cerrarSesion() {
  localStorage.clear();
  location.reload();
}

// AUTOLOGIN
window.onload = () => {
  if (localStorage.getItem("usuario")) {
    login.style.display = "none";
    app.style.display = "block";
    cargarDatos();
  }
};

</script>

</body>
</html>
