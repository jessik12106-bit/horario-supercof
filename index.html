<!DOCTYPE html>
<html>
<head>
  <title>Gestión de Horarios</title>

  <style>
    body {
      font-family: Arial;
      background: #eef2f7;
      margin: 0;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
      overflow-x: auto;
    }

    input, select {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #1d4ed8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      min-width: 1200px;
    }

    th {
      background: #2563eb;
      color: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
      white-space: nowrap;
    }

    tr:hover {
      background: #f1f5f9;
    }

    /* ENCABEZADOS FIJOS */
    th {
      position: sticky;
      top: 0;
      z-index: 2;
    }

    tr:nth-child(2) th {
      top: 40px;
      z-index: 1;
    }

    /* COLUMNAS FIJAS */
    td:first-child,
    th:first-child {
      position: sticky;
      left: 0;
      background: white;
      z-index: 3;
    }

    td:nth-child(2),
    th:nth-child(2) {
      position: sticky;
      left: 120px;
      background: white;
      z-index: 3;
    }

    th:first-child,
    th:nth-child(2) {
      background: #2563eb;
      color: white;
    }

    .admin-panel {
      margin-bottom: 20px;
    }

    .editable {
      cursor: pointer;
      font-weight: bold;
    }

    .editable:hover {
      outline: 2px solid #2563eb;
    }

  </style>
</head>

<body>

<header>📅 Sistema de Horarios</header>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="login">
    <h2>Iniciar sesión</h2>

    <input type="text" id="usuario" placeholder="Usuario"><br>

    <input type="password" id="password" placeholder="Contraseña"><br>

    <button onclick="login()">Ingresar</button>
  </div>

  <!-- APP -->
  <div id="app" style="display:none;">

    <button onclick="cerrarSesion()" style="float:right;">
      Cerrar sesión
    </button>

    <!-- PANEL ADMIN -->
    <div id="adminPanel" class="admin-panel" style="display:none;">

      <button onclick="activarEdicion()">
        ✏️ Activar edición
      </button>

      <button onclick="desactivarEdicion()">
        🔒 Bloquear edición
      </button>

    </div>

    <div class="card">

      <h2>Horarios</h2>

      🔎 Buscar empleado:
      <input type="text" id="filtroNombre" onkeyup="filtrar()">

      👥 Grupo:
      <select id="filtroGrupo" onchange="filtrar()">
        <option value="">Todos</option>
      </select>

      <table id="tabla"></table>

    </div>

  </div>

</div>

<script>

const url = "TU_URL_GOOGLE_SCRIPT";

let datosGlobal = [];

let modoEdicion = false;

const empleadosResaltados = [
  "cristhian perez",
  "patricia marin",
  "liliana prieto",
  "santiago fajardo",
  "gustavo morales",
  "fabian valero",
  "wilmar chavez",
  "sneider rios"
];

// LOGIN
function login() {

  const usuario = document.getElementById("usuario").value;
  const password = document.getElementById("password").value;

  fetch(url, {
    method: "POST",
    body: JSON.stringify({
      action: "login",
      usuario: usuario,
      password: password
    })
  })
  .then(res => res.json())
  .then(data => {

    if (data.success) {

      localStorage.setItem("usuario", usuario);
      localStorage.setItem("rol", data.rol);

      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";

      // MOSTRAR PANEL ADMIN
      if (data.rol === "admin") {
        document.getElementById("adminPanel").style.display = "block";
      }

      cargarDatos();

    } else {
      alert("Usuario o contraseña incorrectos");
    }

  });

}

// CARGAR DATOS
function cargarDatos() {

  fetch(url)
    .then(res => res.json())
    .then(data => {

      datosGlobal = data;

      llenarFiltroGrupo(data);

      pintarTabla(data);

    });

}

// FILTRO GRUPO
function llenarFiltroGrupo(data) {

  let grupos = new Set();

  data.slice(2).forEach(fila => {
    grupos.add(fila[0]);
  });

  let select = document.getElementById("filtroGrupo");

  select.innerHTML = '<option value="">Todos</option>';

  grupos.forEach(g => {

    let option = document.createElement("option");

    option.value = g;
    option.text = g;

    select.appendChild(option);

  });

}

// FORMATO FECHA
function formatearFecha(fechaISO) {

  let fecha = new Date(fechaISO);

  return fecha.toLocaleDateString("es-CO", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });

}

// PINTAR TABLA
function pintarTabla(data) {

  let tabla = document.getElementById("tabla");

  tabla.innerHTML = "";

  data.forEach((fila, i) => {

    let tr = document.createElement("tr");

    fila.forEach((col, j) => {

      let celda = document.createElement(i < 2 ? "th" : "td");

      // FORMATO FECHA
      if (typeof col === "string" &&
          col.includes("T") &&
          col.includes("Z")) {

        celda.innerText = formatearFecha(col);

      } else {

        celda.innerText = col;

      }

      // RESALTAR EMPLEADOS
      if (i > 1 && j === 1) {

        if (empleadosResaltados.includes(col.toLowerCase())) {

          celda.style.fontWeight = "bold";
          celda.style.background = "#fde68a";

        }

      }

      // COLORES TURNOS
      if (i > 1) {

        let valor = col.toString().toUpperCase();

        if (["M","M1"].includes(valor)) celda.style.background = "#bbf7d0";

        else if (["T","T1"].includes(valor)) celda.style.background = "#ffffff";

        else if (["N","N1"].includes(valor)) celda.style.background = "#1E90FF";

        else if (["I","I1"].includes(valor)) {
          celda.style.background = "#FF1493";
          celda.style.color = "white";
        }

        else if (["SN","L"].includes(valor)) celda.style.background = "#e5e7eb";

        else if (valor === "IR") celda.style.background = "#fb923c";

        else if (valor === "AN") {
          celda.style.background = "#1e3a8a";
          celda.style.color = "white";
        }

        else if (valor === "LI") celda.style.background = "#fdba74";

        else if (valor === "IN") celda.style.background = "#fca5a5";

        else if (valor === "CAP") celda.style.background = "#c4b5fd";

        else if (valor === "SUSP") {
          celda.style.background = "#7f1d1d";
          celda.style.color = "white";
        }

        else if (valor === "CA") celda.style.background = "#38bdf8";

        else if (valor === "V") {
          celda.style.background = "#166534";
          celda.style.color = "white";
        }

        else if (valor === "DF") celda.style.background = "#fde047";

      }

      // EDITAR CELDA ADMIN
      if (modoEdicion && i > 1 && j > 1) {

        celda.classList.add("editable");

        celda.onclick = function() {

          let nuevoValor = prompt("Nuevo turno:", col);

          if (nuevoValor !== null) {

            celda.innerText = nuevoValor;

            actualizarCelda(i, j, nuevoValor);

          }

        };

      }

      tr.appendChild(celda);

    });

    tabla.appendChild(tr);

  });

}

// FILTRAR
function filtrar() {

  let nombre = document.getElementById("filtroNombre")
    .value.toLowerCase();

  let grupo = document.getElementById("filtroGrupo").value;

  let encabezado1 = datosGlobal[0];
  let encabezado2 = datosGlobal[1];

  let filtrados = datosGlobal.slice(2).filter(fila => {

    let coincideNombre =
      fila[1].toLowerCase().includes(nombre);

    let coincideGrupo =
      grupo === "" || fila[0] === grupo;

    return coincideNombre && coincideGrupo;

  });

  pintarTabla([encabezado1, encabezado2, ...filtrados]);

}

// ACTIVAR EDICIÓN
function activarEdicion() {

  modoEdicion = true;

  pintarTabla(datosGlobal);

  alert("Modo edición activado");

}

// DESACTIVAR EDICIÓN
function desactivarEdicion() {

  modoEdicion = false;

  pintarTabla(datosGlobal);

  alert("Modo edición bloqueado");

}

// ACTUALIZAR GOOGLE SHEETS
function actualizarCelda(fila, columna, valor) {

  fetch(url, {
    method: "POST",
    body: JSON.stringify({
      action: "editar",
      fila: fila + 1,
      columna: columna + 1,
      valor: valor
    })
  })
  .then(res => res.json())
  .then(data => {

    if (data.success) {
      alert("Horario actualizado");
    } else {
      alert("Error al guardar");
    }

  });

}

// CERRAR SESIÓN
function cerrarSesion() {

  localStorage.clear();

  location.reload();

}

// MANTENER SESIÓN
window.onload = function() {

  const usuario = localStorage.getItem("usuario");
  const rol = localStorage.getItem("rol");

  if (usuario) {

    document.getElementById("login").style.display = "none";

    document.getElementById("app").style.display = "block";

    if (rol === "admin") {
      document.getElementById("adminPanel").style.display = "block";
    }

    cargarDatos();

  }

};

</script>

</body>
</html>
